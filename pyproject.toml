[tool.pylint.messages_control]
max-line-length = 120

[tool.black]
line-length = 120

[tool.ruff]
# See https://docs.astral.sh/ruff/configuration/ for defaults.
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Note: the linter is temporarily switched off because there are too many
# errors/warnings.

# Default select: ["E4", "E7", "E9", "F"]
select = ["E4", "E7", "E9", "F", "I", "UP", "C901"]
# F403 + F405 means detection of undefined names: the "from xyz import *" prevents that
# from working.
ignore = ["F403", "F405"]
